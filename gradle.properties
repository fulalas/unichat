org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
# Configuration cache is OFF: every change bumps app/build.gradle (see
# AGENTS.md), which is a configuration input, so the cache entry was invalidated
# on literally every build. It only ever paid the serialization cost and stored
# another entry — 142 of them, 6.3 MB, with zero hits.
org.gradle.configuration-cache=false
