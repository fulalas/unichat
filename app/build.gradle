plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def tgProps = new Properties()
def tgFile = rootProject.file('telegram.properties')
if (tgFile.exists()) {
    tgFile.withInputStream { tgProps.load(it) }
} else {
    throw new GradleException(
        "telegram.properties not found.\n" +
        "  cp telegram.properties.template telegram.properties\n" +
        "  then fill in your own api_id and api_hash from https://my.telegram.org"
    )
}
def tgApiId = tgProps.getProperty('api_id', '').trim()
def tgApiHash = tgProps.getProperty('api_hash', '').trim()
if (!(tgApiId ==~ /^[0-9]+$/)) {
    throw new GradleException("telegram.properties: api_id must be digits only, got '${tgApiId}'")
}
if (!(tgApiHash ==~ /^[0-9a-fA-F]{32}$/)) {
    throw new GradleException("telegram.properties: api_hash must be 32 hex characters")
}

android {
    namespace 'org.unichat.app'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        buildConfigField "int", "TG_API_ID", tgApiId
        buildConfigField "String", "TG_API_HASH", "\"${tgApiHash}\""

        applicationId "org.unichat.app"
        minSdk 29
        targetSdk 35
        versionCode 218
        versionName "0.48.5"
        ndk {
            // arm64 only: the three-ABI APK carried ~50 MB of native libraries no
            // real device could ever load. Must stay in step with build.sh's
            // gomobile -target list and build-tdlib.sh's default ABI list.
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        // Fixed key stored in the repo so every build (on any machine) can
        // update the installed app in place without re-pairing WhatsApp.
        release {
            storeFile file('../keystore/unichat.keystore')
            storePassword 'wmchat'
            keyAlias 'wmchat'
            keyPassword 'wmchat'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    packaging {
        jniLibs {
            // Store native libs (the large Go bridge .so) compressed in the APK
            // instead of AGP's default uncompressed packaging. Shrinks the APK;
            // libs are extracted at install time (fine for minSdk 29).
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation files('libs/wmbridge.aar')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'com.google.zxing:core:3.5.3'
}
